[package]
name = "pass-wasm"
description = "The browser extension's own vault: pass-agent's request handlers and pass-core in WebAssembly"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# `rlib` for the native tests.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pass-agent = { path = "../agent", default-features = false }
# Google Drive sync without a network stack: the extension does the HTTP with fetch.
pass-core = { path = "../core", default-features = false, features = ["gdrive-core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
# `crypto.getRandomValues` in the browser.
getrandom = { version = "0.2", features = ["js"] }
# Pinned: the build script runs the wasm-bindgen CLI of exactly this version.
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
# The QR code a new device shows for another device of the account to scan.
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
pass-wasm-kdf = { path = "kdf" }
url = "2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# `tests/web.rs` in Node; the test runner comes with the pinned CLI.
wasm-bindgen-test = "=0.3.79"
