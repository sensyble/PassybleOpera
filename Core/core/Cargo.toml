[package]
name = "pass-core"
description = "Vault, crypto, TOTP and passkey authenticator shared by every Pass client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "pass_core"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi"]

[features]
default = ["webdav", "gdrive", "icons", "import-kdbx", "import-pgp"]
# Sync over WebDAV / Passyble Server. `rustls` is named directly only for certificate pinning.
webdav = ["dep:ureq", "dep:rustls", "sync-core"]
# Sync through the Google Drive app folder. The platform supplies OAuth access tokens.
gdrive = ["webdav", "gdrive-core"]
# The same Google Drive sync without a network stack, driven by the browser extension's WebAssembly.
gdrive-core = ["sync-core"]
# The vault's sync bookkeeping, shared by every sync.
sync-core = []
uniffi = ["dep:uniffi"]
# Website icons for item avatars, fetched, decoded and re-encoded as small PNGs.
icons = ["webdav", "dep:image", "image/png", "image/jpeg", "image/ico", "image/webp", "image/gif"]
# Decode QR codes from PNG/JPEG images. Android scans with the camera, so it leaves this off.
import-qr = ["dep:image", "dep:rqrr"]
# Password-protected KeePass databases (.kdbx and .kdb) through the `keepass` crate.
import-kdbx = ["dep:keepass"]
# Passphrase-encrypted OpenPGP messages (Proton Pass export) through rPGP.
import-pgp = ["dep:pgp"]

[dependencies]
# Encrypted exports of other apps: Bitwarden, Aegis and 2FAS. Same RustCrypto generation as the rest.
aes = "=0.8.4"
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
argon2 = "0.5"
base64 = "0.22"
cbc = { version = "=0.1.2", features = ["alloc"] }
chacha20poly1305 = "0.10"
csv = "1"
# Shared vaults: Ed25519 signatures of the member list and of each user's public keys. The same
# version `pgp` brings in. No `fast` tables: a few signatures per change don't need them.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
hkdf = "=0.12.4"
# Shared vaults: the vault key is wrapped for each member with HPKE (RFC 9180), X25519 and
# ChaCha20-Poly1305. 0.12 matches the RustCrypto versions used here; newer releases would pull a
# second copy of most of the stack.
hpke = { version = "=0.12.0", default-features = false, features = ["alloc", "x25519"] }
# Only here to turn on `zeroize` for the X25519 private keys hpke creates.
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
hmac = "0.12"
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }
# KeePass databases (feature `import-kdbx`). MIT.
keepass = { version = "=0.15.3", optional = true, default-features = false }
# Passkeys (ES256). 0.14 because 0.13 pulls crypto-bigint 0.5, whose RUSTSEC-2026-0387 timing
# advisory reaches the signing path.
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
pbkdf2 = { version = "=0.12.2", default-features = false, features = ["hmac"] }
# Pairing links (`pass+server://`); already in the tree through `url`.
percent-encoding = "2"
# Proton Pass' passphrase-encrypted export (feature `import-pgp`): rPGP, MIT OR Apache-2.0.
pgp = { version = "=0.21.0", optional = true, default-features = false }
psl = "2"
rand = "0.8"
rqrr = { version = "0.11", optional = true, default-features = false }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
scrypt = { version = "=0.11.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
# The Passyble password is normalized to NFC before Argon2id (src/account_key.rs), so the same
# password typed on Windows, Android and iOS keyboards gives the same keys. MIT OR Apache-2.0.
unicode-normalization = { version = "0.1", default-features = false, features = ["std"] }
uniffi = { version = "0.29", optional = true, features = ["cli"] }
ureq = { version = "2", optional = true }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
# Proton Pass and 1Password exports are ZIP files. Deflate only (pure-Rust backend); `aes-crypto`
# opens AES-encrypted members.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2", "aes-crypto"] }

# On `wasm32-unknown-unknown` std has no randomness or clock: keys, nonces, salts and ids draw from
# `crypto.getRandomValues` and `now_ms` reads `Date.now()`.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
uuid = { version = "1", features = ["v4", "js"] }

[dev-dependencies]
ciborium = "0.2"
sha2 = "0.10"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
# Self-signed certificates for the certificate-pinning tests (same version as pass-server).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# Renders a test QR code for the image import (feature `import-qr`).
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
# Writes the KDBX 4 test databases of the KeePass import tests.
keepass = { version = "=0.15.3", default-features = false, features = ["save_kdbx4"] }
